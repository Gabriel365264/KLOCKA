<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Klocka – Digitale Eieruhr</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap');

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Noto Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    :root {
      --ikea-blue: #0051BA;
      --ikea-blue-dark: #00337a;
      --header-grey: #555555;
      --bg-light: #ffffff;
      --panel-bg: #ffffff;
      --accent-green: #00c853;
      --accent-red: #ff1744;
      --accent-pink: #ff8aa7;
      --accent-add: #ff80ab;
      --config-pill: #c5b7ff;
      --text-main: #111111;
      --text-muted: #555555;
    }

    body {
      background: var(--bg-light);
      color: var(--text-main);
      line-height: 1.5;
    }

    /* HEADER */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background: var(--ikea-blue-dark);
      color: #fff;
    }

    .app-title {
      font-size: 2.0rem;
      font-weight: 700;
    }

    .header-right {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .header-button {
      border-radius: 999px;
      border: none;
      padding: 8px 16px;
      background: #ffffff33;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
    }

    #btnFullscreen {
      font-size: 1.3rem;
    }

    /* MAIN LAYOUT */
    .app-main {
      padding: 24px;
    }

    .timer-container {
      background: var(--panel-bg);
      border-radius: 0;
      padding: 8px 0 24px 0;
    }

    .timer-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 140px 140px; /* Balken + Start + Stop */
      gap: 12px;
      align-items: center;
      padding: 6px 16px;
      font-size: 1rem;
    }

    .timer-row + .timer-row {
      margin-top: 6px;
    }

    .timer-bar {
      position: relative;
      width: 100%;
      height: 40px;
      border-radius: 0;
      overflow: hidden;
      background: transparent;
    }

    .timer-bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0; /* per JS *
