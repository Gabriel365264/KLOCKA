<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Klocka – Digitale Eieruhr</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap');

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Noto Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* Dynamische Basis-Schriftgröße:
       - mindestens 14px
       - skaliert mit Bildschirmbreite
       - maximal 22px
    */
    html {
      font-size: clamp(14px, 1.2vw, 22px);
    }

    :root {
      --ikea-blue: #0051BA;
      --ikea-blue-dark: #00337a;
      --bg-light: #ffffff;
      --panel-bg: #ffffff;
      --accent-green: #00c853;
      --accent-red: #ff1744;
      --accent-pink: #ff8aa7;
      --text-main: #111111;
    }

    body {
      background: var(--bg-light);
      color: var(--text-main);
      line-height: 1.5;
    }

    /* HEADER */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 1.5rem;
      background: var(--ikea-blue-dark);
      color: #fff;
    }

    .app-title {
      font-size: 1.6rem;
      font-weight: 700;
    }

    .header-right {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    .header-button {
      border-radius: 999px;
      border: none;
      padding: 0.5rem 1rem;
      background: #ffffff33;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
    }

    #btnFullscreen {
      font-size: 1.2rem;
    }

    /* MAIN LAYOUT */
    .app-main {
      padding: 1.5rem;
    }

    .timer-container {
      background: var(--panel-bg);
      border-radius: 0;
      padding: 0.5rem 0 1.5rem 0;
    }

    .timer-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 8rem 8rem; /* Balken + Start + Stop */
      gap: 0.75rem;
      align-items: center;
      padding: 0.4rem 1rem;
      font-size: 1rem;
    }

    .timer-row + .timer-row {
      margin-top: 0.4rem;
    }

    .timer-bar {
      position: relative;
      width: 100%;
      height: 3rem; /* höhere Balken für bessere Sichtbarkeit */
      border-radius: 0;
      overflow: hidden;
      background: transparent;
    }

    .timer-bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0; /* per JS */
      background: var(--accent-pink);
      transition: width 0.3s linear;
      z-index: 0;
    }

    .timer-bar-fill.expired {
      background: var(--accent-red);
      animation: blink 1s linear infinite;
    }

    .timer-bar-content {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4rem 0.75rem;
      height: 100%;
    }

    .timer-name {
      font-weight: 600;
      font-size: 1.1rem;
    }

    .timer-time {
      font-size: 1.1rem;
      font-weight: 600;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.3; }
    }
