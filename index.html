<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Klocka – Digitale Eieruhr (Variante B)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap');

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Noto Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    :root {
      /* Skapa-orientierte Tokens */
      --color-blue-primary: #0058A3;
      --color-blue-dark: #003D73;
      --color-yellow-primary: #FFDA1A;
      --color-grey-50: #F5F5F5;
      --color-grey-100: #E5E5E5;
      --color-grey-200: #DFDFDF;
      --color-grey-700: #484848;
      --color-grey-900: #111111;
      --color-white: #FFFFFF;
      --color-success: #00AB00;
      --color-error: #E00751;

      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;

      --radius-sm: 4px;
      --radius-md: 8px;

      --font-size-sm: 14px;
      --font-size-md: 16px;
      --font-size-lg: 20px;
      --font-size-xl: 24px;
      --font-size-xxl: 32px;

      --line-height-tight: 1.2;
      --line-height-normal: 1.5;

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.1);
      --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.12);
    }

    body {
      background: var(--color-white);
      color: var(--color-grey-900);
      line-height: var(--line-height-normal);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* HEADER */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--spacing-md) var(--spacing-lg);
      background: var(--color-blue-primary);
      color: var(--color-white);
      box-shadow: var(--shadow-sm);
    }

    .app-title {
      font-size: var(--font-size-xxl);
      font-weight: 700;
      line-height: var(--line-height-tight);
    }

    .header-right {
      display: flex;
      gap: var(--spacing-sm);
      align-items: center;
    }

    .header-button {
      min-width: 44px;
      min-height: 44px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.3);
      padding: var(--spacing-sm);
      background: transparent;
      color: var(--color-white);
      cursor: pointer;
      font-weight: 600;
      font-size: var(--font-size-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .header-button:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.5);
    }

    .header-button:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 2px;
    }

    /* MAIN LAYOUT */
    .app-main {
      padding: var(--spacing-lg);
      max-width: 1400px;
      margin: 0 auto;
    }

    .timer-container {
      background: var(--color-white);
      border-radius: var(--radius-md);
      padding: var(--spacing-sm) 0 var(--spacing-lg) 0;
    }

    .timer-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 160px 160px;
      gap: var(--spacing-md);
      align-items: center;
      padding: var(--spacing-sm) var(--spacing-md);
    }

    .timer-row + .timer-row {
      margin-top: var(--spacing-sm);
    }

    .timer-bar {
      position: relative;
      width: 100%;
      height: 56px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: var(--color-grey-100);
      border: 1px solid var(--color-grey-200);
    }

    .timer-bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0;
      background: var(--color-yellow-primary);
      transition: width 0.3s ease-out;
      z-index: 0;
    }

    .timer-bar-fill.expired {
      background: var(--color-error);
      animation: blink 1s ease-in-out infinite;
    }

    .timer-bar-content {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 var(--spacing-md);
      height: 100%;
    }

    .timer-name {
      font-weight: 700;
      font-size: var(--font-size-xl);
      color: var(--color-grey-900);
      line-height: var(--line-height-tight);
    }

    .timer-time {
      font-size: var(--font-size-xl);
      font-weight: 600;
      color: var(--color-grey-700);
      font-variant-numeric: tabular-nums;
      line-height: var(--line-height-tight);
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0.4; }
    }

    /* BUTTONS */
    .btn-start {
      background: var(--color-grey-50);
      color: var(--color-success);
      border: 2px solid var(--color-grey-200);
    }

    .btn-start:hover {
      background: var(--color-grey-100);
      border-color: var(--color-success);
    }

    .btn-start:active {
      background: var(--color-grey-200);
    }

    .btn-stop {
      background: var(--color-error);
      color: var(--color-white);
      border: 2px solid var(--color-error);
    }

    .btn-stop:hover {
      background: #C00648;
      border-color: #C00648;
    }

    .btn-stop:active {
      background: #A00540;
    }

    .btn-start,
    .btn-stop {
      border-radius: var(--radius-sm);
      height: 56px;
      min-width: 160px;
      padding: 0 var(--spacing-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 700;
      font-size: var(--font-size-lg);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
    }

    .btn-start:focus-visible,
    .btn-stop:focus-visible {
      outline: 3px solid var(--color-blue-primary);
      outline-offset: 2px;
    }

    @media (max-width: 768px) {
      .app-main { padding: var(--spacing-md); }
      .app-header { flex-direction: column; align-items: flex-start; gap: var(--spacing-sm); }
      .timer-row { grid-template-columns: 1fr; }
      .btn-start, .btn-stop { width: 100%; }
    }

    @media (max-width: 600px) {
      .timer-row { padding-inline: var(--spacing-sm); }
      .timer-name, .timer-time { font-size: var(--font-size-lg); }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">Klocka</h1>
    <div class="header-right">
      <button class="header-button" id="btnFullscreen" aria-label="Vollbild umschalten">⛶</button>
    </div>
  </header>

  <main class="app-main">
    <section id="timerView" aria-label="Timer-Übersicht">
      <div class="timer-container">
        <div id="timerList"></div>
      </div>
    </section>
  </main>

  <script>
    const FIXED_PRODUCTS = [
      { id: 1,  name: "Pommes",        minutes: 10 },
      { id: 2,  name: "Erbsen",        minutes: 20 },
      { id: 3,  name: "Lachsfilet",    minutes: 20 },
      { id: 4,  name: "Plantballs",    minutes: 30 },
      { id: 5,  name: "Waffeln",       minutes: 40 },
      { id: 6,  name: "Brötchen",      minutes: 240 },
      { id: 7,  name: "Falafel",       minutes: 20 },
      { id: 8,  name: "Plant Hot Dog", minutes: 20 },
      { id: 9,  name: "Veggi Hot Dog", minutes: 20 },
      { id: 10, name: "Plant Nuggets", minutes: 40 }
    ];

    const STORAGE_KEYS = { timers: 'klockaTimers' };

    let products = FIXED_PRODUCTS.slice();
    let timers = {};

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    function init() {
      loadTimers();
      renderTimerView();
      setupEvents();
      startLoop();
    }

    init();

    function loadTimers() {
      const stored = localStorage.getItem(STORAGE_KEYS.timers);
      if (!stored) return;
      try {
        const obj = JSON.parse(stored);
        const now = Date.now();
        for (const [id, t] of Object.entries(obj)) {
          if (!t.totalMs) continue;
          if (t.running && t.endTimeMs) {
            const remaining = Math.max(0, t.endTimeMs - now);
            timers[id] = {
              totalMs: t.totalMs,
              remainingMs: remaining,
              running: remaining > 0,
              endTimeMs: remaining > 0 ? t.endTimeMs : null
            };
          } else {
            timers[id] = {
              totalMs: t.totalMs,
              remainingMs: t.remainingMs || t.totalMs,
              running: false,
              endTimeMs: null
            };
          }
        }
      } catch (e) {
        console.error('Fehler beim Laden der Timer', e);
        timers = {};
      }
    }

    function saveTimers() {
      localStorage.setItem(STORAGE_KEYS.timers, JSON.stringify(timers));
    }

    function setupEvents() {
      const fsBtn = document.getElementById('btnFullscreen');
      if (fsBtn) fsBtn.addEventListener('click', toggleFullscreen);
    }

    function renderTimerView() {
      const container = document.getElementById('timerList');
      container.innerHTML = '';

      products.forEach(p => {
        const totalMs = p.minutes * 60 * 1000;

        if (!timers[p.id]) {
          timers[p.id] = {
            totalMs: totalMs,
            remainingMs: totalMs,
            running: false,
            endTimeMs: null
          };
        } else {
          timers[p.id].totalMs = totalMs;
          if (!timers[p.id].running && timers[p.id].remainingMs > totalMs) {
            timers[p.id].remainingMs = totalMs;
          }
        }

        const row = document.createElement('div');
        row.className = 'timer-row';
        row.dataset.id = p.id;

        const bar = document.createElement('div');
        bar.className = 'timer-bar';

        const barFill = document.createElement('div');
        barFill.className = 'timer-bar-fill';

        const barContent = document.createElement('div');
        barContent.className = 'timer-bar-content';

        const nameLabel = document.createElement('span');
        nameLabel.className = 'timer-name';
        nameLabel.textContent = p.name;

        const timeDiv = document.createElement('span');
        timeDiv.className = 'timer-time';

        barContent.appendChild(nameLabel);
        barContent.appendChild(timeDiv);
        bar.appendChild(barFill);
        bar.appendChild(barContent);

        const startBtn = document.createElement('button');
        startBtn.className = 'btn-start';
        startBtn.textContent = 'Start';

        const stopBtn = document.createElement('button');
        stopBtn.className = 'btn-stop';
        stopBtn.textContent = 'Stop';

        row.appendChild(bar);
        row.appendChild(startBtn);
        row.appendChild(stopBtn);

        row._nameLabel = nameLabel;
        row._progressBar = barFill;
        row._timeDiv = timeDiv;

        startBtn.addEventListener('click', () => startTimer(p.id));
        stopBtn.addEventListener('click', () => stopTimer(p.id));

        container.appendChild(row);
        updateRowUI(p.id);
      });

      saveTimers();
    }

    function startTimer(id) {
      const timer = timers[id];
      if (!timer) return;
      timer.remainingMs = timer.totalMs;
      timer.running = true;
      timer.endTimeMs = Date.now() + timer.remainingMs;
      updateRowUI(id);
      saveTimers();
    }

    function stopTimer(id) {
      const timer = timers[id];
      if (!timer) return;
      timer.running = false;
      timer.remainingMs = timer.totalMs;
      timer.endTimeMs = null;
      updateRowUI(id);
      saveTimers();
    }

    function updateRowUI(id) {
      const row = document.querySelector('.timer-row[data-id="' + id + '"]');
      const timer = timers[id];
      if (!row || !timer) return;

      const timeDiv = row._timeDiv;
      const progressBar = row._progressBar;
      timeDiv.textContent = formatDuration(timer.remainingMs);

      const elapsed = Math.max(0, timer.totalMs - timer.remainingMs);
      let ratio = 0;
      if (timer.totalMs > 0) ratio = elapsed / timer.totalMs;
      let percent = Math.max(0, Math.min(100, ratio * 100));
      const expired = timer.remainingMs <= 0;

      if (expired) {
        percent = 100;
        progressBar.classList.add('expired');
      } else {
        progressBar.classList.remove('expired');
      }
      progressBar.style.width = percent + '%';
    }

    function startLoop() {
      setInterval(() => {
        const now = Date.now();
        let changed = false;
        for (const [id, timer] of Object.entries(timers)) {
          if (!timer.running || !timer.endTimeMs) continue;
          timer.remainingMs = Math.max(0, timer.endTimeMs - now);
          if (timer.remainingMs <= 0) {
            timer.running = false;
            timer.endTimeMs = null;
          }
          updateRowUI(id);
          changed = true;
        }
        if (changed) saveTimers();
      }, 500);
    }

    function formatDuration(ms) {
      if (ms <= 0) return '00:00:00';
      const totalSeconds = Math.floor(ms / 1000);
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;
      return String(h).padStart(2,'0') + ':' +
             String(m).padStart(2,'0') + ':' +
             String(s).padStart(2,'0');
    }
  </script>
</body>
