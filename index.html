<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Klocka – Digitale Eieruhr</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap');

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Noto Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    :root {
      /* IKEA Skapa Design Tokens */
      --color-blue-primary: #0058A3;
      --color-blue-dark: #003D73;
      --color-yellow-primary: #FFDA1A;
      --color-grey-50: #F5F5F5;
      --color-grey-100: #E5E5E5;
      --color-grey-200: #DFDFDF;
      --color-grey-300: #CACACA;
      --color-grey-700: #484848;
      --color-grey-900: #111111;
      --color-white: #FFFFFF;
      
      /* Semantic colors */
      --color-success: #00AB00;
      --color-error: #E00751;
      --color-warning: #FBD914;
      
      /* Spacing (8px grid) */
      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;
      --spacing-xxl: 40px;
      
      /* Border radius (Skapa standard) */
      --radius-sm: 4px;
      --radius-md: 8px;
      
      /* Shadows (Skapa elevation) */
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.08);
      --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.12);
      --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.16);
      
      /* Typography */
      --font-size-sm: 14px;
      --font-size-md: 16px;
      --font-size-lg: 20px;
      --font-size-xl: 24px;
      --font-size-xxl: 32px;
      
      --line-height-tight: 1.2;
      --line-height-normal: 1.5;
    }

    body {
      background: var(--color-grey-50);
      color: var(--color-grey-900);
      line-height: var(--line-height-normal);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* HEADER - Skapa Style */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--spacing-md) var(--spacing-lg);
      background: var(--color-blue-primary);
      color: var(--color-white);
      box-shadow: var(--shadow-md);
    }

    .app-title {
      font-size: var(--font-size-xxl);
      font-weight: 700;
      line-height: var(--line-height-tight);
    }

    .header-right {
      display: flex;
      gap: var(--spacing-sm);
      align-items: center;
    }

    .header-button {
      min-width: 48px;
      min-height: 48px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.3);
      padding: 0;
      background: transparent;
      color: var(--color-white);
      cursor: pointer;
      font-size: var(--font-size-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .header-button:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.5);
    }

    .header-button:active {
      background: rgba(255, 255, 255, 0.25);
    }

    /* MAIN LAYOUT */
    .app-main {
      padding: var(--spacing-lg);
      max-width: 1400px;
      margin: 0 auto;
    }

    .timer-container {
      background: var(--color-white);
      border-radius: var(--radius-md);
      padding: var(--spacing-md);
      box-shadow: var(--shadow-sm);
    }

    .timer-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 140px 140px;
      gap: var(--spacing-md);
      align-items: center;
      padding: var(--spacing-md);
      background: var(--color-white);
      border-radius: var(--radius-sm);
      transition: background-color 0.2s ease;
    }

    .timer-row:hover {
      background: var(--color-grey-50);
    }

    .timer-row + .timer-row {
      margin-top: var(--spacing-sm);
      border-top: 1px solid var(--color-grey-100);
    }

    /* Timer Bar mit Fortschritt */
    .timer-bar {
      position: relative;
      width: 100%;
      min-height: 56px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: var(--color-grey-100);
      border: 1px solid var(--color-grey-200);
    }

    .timer-bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0;
      background: var(--color-yellow-primary);
      transition: width 0.3s ease-out;
      z-index: 0;
    }

    .timer-bar-fill.expired {
      background: var(--color-error);
      animation: blink 1s ease-in-out infinite;
    }

    .timer-bar-content {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--spacing-md);
      min-height: 56px;
    }

    .timer-name {
      font-weight: 700;
      font-size: var(--font-size-xl);
      color: var(--color-grey-900);
      line-height: var(--line-height-tight);
    }

    .timer-time {
      font-size: var(--font-size-xl);
      font-weight: 600;
      color: var(--color-grey-700);
      font-variant-numeric: tabular-nums;
      line-height: var(--line-height-tight);
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0.4; }
    }

    /* BUTTONS - Skapa Style */
    .btn-start {
      background: var(--color-white);
      color: var(--color-success);
      border: 2px solid var(--color-grey-200);
    }

    .btn-start:hover {
      background: var(--color-grey-50);
      border-color: var(--color-success);
    }

    .btn-start:active {
      background: var(--color-grey-100);
    }

    .btn-stop {
      background: var(--color-error);
      color: var(--color-white);
      border: 2px solid var(--color-error);
    }

    .btn-stop:hover {
      background: #C00648;
      border-color: #C00648;
    }

    .btn-stop:active {
      background: #A00540;
    }

    .btn-start,
    .btn-stop {
      border-radius: var(--radius-sm);
      height: 56px;
      min-width: 140px;
      padding: 0 var(--spacing-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 700;
      font-size: var(--font-size-lg);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
    }

    .btn-start:focus-visible,
    .btn-stop:focus-visible {
      outline: 3px solid var(--color-blue-primary);
      outline-offset: 2px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .app-main { 
        padding: var(--spacing-md); 
      }
      
      .app-header { 
        flex-direction: column; 
        align-items: flex-start; 
        gap: var(--spacing-sm); 
      }
      
      .timer-row { 
        grid-template-columns: 1fr;
        gap: var(--spacing-sm);
      }
      
      .btn-start,
      .btn-stop {
        width: 100%;
      }
    }

    @media (max-width: 600px) {
      .timer-row { 
        padding: var(--spacing-sm); 
      }
      
      .timer-name {
        font-size: var(--font-size-lg);
      }
      
      .timer-time {
        font-size: var(--font-size-lg);
      }
      
      .app-title {
        font-size: var(--font-size-xl);
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">Klocka</h1>
    <div class="header-right">
      <button class="header-button" id="btnFullscreen" aria-label="Vollbild umschalten">⛶</button>
    </div>
  </header>

  <main class="app-main">
    <section id="timerView" aria-label="Timer-Übersicht">
      <div class="timer-container">
        <div id="timerList" role="list"></div>
      </div>
    </section>
  </main>

  <script>
    // --- Feste Produkte (Deutsch) ---
    const FIXED_PRODUCTS = [
      { id: 1,  name: "Pommes",        minutes: 10 },
      { id: 2,  name: "Erbsen",        minutes: 20 },
      { id: 3,  name: "Lachsfilet",    minutes: 20 },
      { id: 4,  name: "Plantballs",    minutes: 30 },
      { id: 5,  name: "Waffeln",       minutes: 40 },
      { id: 6,  name: "Brötchen",      minutes: 240 },
      { id: 7,  name: "Falafel",       minutes: 20 },
      { id: 8,  name: "Plant Hot Dog", minutes: 20 },
      { id: 9,  name: "Veggi Hot Dog", minutes: 20 },
      { id: 10, name: "Plant Nuggets", minutes: 40 }
    ];

    const STORAGE_KEYS = {
      timers: 'klockaTimers'
    };

    let products = FIXED_PRODUCTS.slice();
    let timers = {};

    // --- Fullscreen ---
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // --- App-Initialisierung ---
    function init() {
      console.log('Klocka init - Skapa Design System');
      loadTimers();
      renderTimerView();
      setupEvents();
      startLoop();
    }

    init();

    // --- Timer-Persistenz ---
    function loadTimers() {
      const stored = localStorage.getItem(STORAGE_KEYS.timers);
      if (!stored) return;
      try {
        const obj = JSON.parse(stored);
        const now = Date.now();
        for (const [id, t] of Object.entries(obj)) {
          if (!t.totalMs) continue;
          if (t.running && t.endTimeMs) {
            const remaining = Math.max(0, t.endTimeMs - now);
            timers[id] = {
              totalMs: t.totalMs,
              remainingMs: remaining,
              running: remaining > 0,
              endTimeMs: remaining > 0 ? t.endTimeMs : null
            };
          } else {
            timers[id] = {
              totalMs: t.totalMs,
              remainingMs: t.remainingMs || t.totalMs,
              running: false,
              endTimeMs: null
            };
          }
        }
      } catch (e) {
        console.error('Fehler beim Laden der Timer', e);
        timers = {};
      }
    }

    function saveTimers() {
      localStorage.setItem(STORAGE_KEYS.timers, JSON.stringify(timers));
    }

    // --- Events ---
    function setupEvents() {
      const fsBtn = document.getElementById('btnFullscreen');
      if (fsBtn) {
        fsBtn.addEventListener('click', toggleFullscreen);
      }
    }

    // --- Timer-Ansicht ---
    function renderTimerView() {
      const container = document.getElementById('timerList');
      container.innerHTML = '';

      products.forEach(p => {
        const totalMs = p.minutes * 60 * 1000;

        if (!timers[p.id]) {
          timers[p.id] = {
            totalMs: totalMs,
            remainingMs: totalMs,
            running: false,
            endTimeMs: null
          };
        } else {
          timers[p.id].totalMs = totalMs;
